<div class="login-wrapper">
  <section class="login-hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="hero-content">
      <div class="brand-lockup">
        <img class="brand-badge-img" src="brand/prodflow-logo.png" width="48" height="48" alt="ProdFlow" />
        <span class="brand-title">ProdFlow</span>
      </div>
      <h1>Le stock, sous contrôle.</h1>
      <p>Pilotage des commandes, réceptions et alertes pour les équipes magasin.</p>
    </div>
    <div class="footer-note">Espace professionnel · Ops & production</div>
  </section>

  <section class="login-side">
    <div class="login-card">
      <h2>Connexion</h2>
      <p class="sub">Accédez à votre espace ProdFlow</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required email class="form-input" placeholder="vous@entreprise.com" #emailInput="ngModel" />
          <div *ngIf="emailInput.invalid && emailInput.touched" class="text-danger field-error">Email valide requis.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required class="form-input" placeholder="••••••••" #passInput="ngModel" />
          <div *ngIf="passInput.invalid && passInput.touched" class="text-danger field-error">Mot de passe requis.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loginForm.invalid || loading">
          {{ loading ? 'Connexion…' : 'Se connecter' }}
        </button>

        <div class="login-footer">
          Compte créé uniquement par un super administrateur.
        </div>
      </form>
    </div>
  </section>
</div>
