    <div class="profile-container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mon Profil</h2>
      </div>

      <div class="grid grid-2">
        <!-- Informations personnelles -->
        <div class="glass-card">
          <h3 class="mb-3 d-flex align-items-center gap-2">
            <span class="material-icons-round text-primary">person</span>
            Informations Générales
          </h3>
          
          <form (ngSubmit)="onUpdateProfile()" #profileForm="ngForm">
            <div class="grid grid-2">
              <div class="form-group">
                <label class="form-label" for="firstName">Prénom</label>
                <input 
                  type="text" 
                  id="firstName" 
                  name="firstName" 
                  [(ngModel)]="profile.firstName" 
                  required 
                  class="form-input"
                />
              </div>

              <div class="form-group">
                <label class="form-label" for="lastName">Nom</label>
                <input 
                  type="text" 
                  id="lastName" 
                  name="lastName" 
                  [(ngModel)]="profile.lastName" 
                  required 
                  class="form-input"
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Adresse Email (Non modifiable)</label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                [value]="profile.email" 
                disabled 
                class="form-input"
                style="opacity: 0.7;"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Numéro de téléphone</label>
              <input 
                type="text" 
                id="phone" 
                name="phone" 
                [(ngModel)]="profile.phone" 
                required 
                class="form-input"
              />
            </div>

            <div class="form-group">
              <label class="form-label">Rôle assigné</label>
              <input 
                type="text" 
                [value]="getRoleLabel(profile.role)" 
                disabled 
                class="form-input"
                style="opacity: 0.7;"
              />
            </div>

            <button 
              type="submit" 
              [disabled]="profileForm.invalid || loadingProfile" 
              class="btn btn-primary"
            >
              Sauvegarder les modifications
            </button>
          </form>
        </div>

        <!-- Changement de mot de passe -->
        <div class="glass-card">
          <h3 class="mb-3 d-flex align-items-center gap-2">
            <span class="material-icons-round text-primary">lock</span>
            Sécurité & Mot de Passe
          </h3>

          <form (ngSubmit)="onChangePassword()" #passwordForm="ngForm">
            <div class="form-group">
              <label class="form-label" for="currentPassword">Mot de passe actuel</label>
              <input 
                type="password" 
                id="currentPassword" 
                name="currentPassword" 
                [(ngModel)]="passwordData.currentPassword" 
                required 
                class="form-input"
                placeholder="Saisissez votre mot de passe actuel"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="newPassword">Nouveau mot de passe</label>
              <input 
                type="password" 
                id="newPassword" 
                name="newPassword" 
                [(ngModel)]="passwordData.newPassword" 
                required 
                minlength="6"
                class="form-input"
                placeholder="Au moins 6 caractères"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirmer le nouveau mot de passe</label>
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                [(ngModel)]="passwordData.confirmPassword" 
                required 
                class="form-input"
                placeholder="Ressaisissez le nouveau mot de passe"
              />
              <div *ngIf="passwordData.newPassword !== passwordData.confirmPassword && passwordForm.submitted" class="text-danger mt-1 font-semibold" style="font-size: 0.75rem;">
                Les mots de passe ne correspondent pas.
              </div>
            </div>

            <button 
              type="submit" 
              [disabled]="passwordForm.invalid || loadingPassword" 
              class="btn btn-primary"
            >
              Changer le mot de passe
            </button>
          </form>
        </div>
      </div>
    </div>
